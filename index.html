 
 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta Premiada | Açaí da Família Castro</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --purple: #200b3d;
  --purple2: #381064;
  --gold: #ffd76a;
  --gold2: #fff0b0;
  --white: #ffffff;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 50% 0%, #6425a0 0%, transparent 40%),
    linear-gradient(145deg, #10051e, #24083d 55%, #12051f);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    radial-gradient(circle, #ffffff 1px, transparent 1.5px);
  background-size: 35px 35px;
}

header {
  text-align: center;
  padding: 25px 15px 10px;
}

.logo {
  font-size: clamp(24px, 5vw, 38px);
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 18px #ffcb5a55;
}

.slogan {
  margin-top: 8px;
  font-size: 13px;
  letter-spacing: 2px;
  color: #ead9ff;
}

main {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.title {
  text-align: center;
  margin: 15px 0 25px;
}

.title h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 48px);
  font-weight: 1000;
  letter-spacing: 2px;
  color: var(--gold);
  text-shadow: 0 3px 0 #7e4800, 0 0 22px #ffc94d44;
}

.title p {
  color: #e8d5ff;
  margin-top: 10px;
  font-size: 14px;
}

.card {
  position: relative;
  padding: 24px 18px 28px;
  border-radius: 28px;
  background: linear-gradient(145deg, #3b1264, #210b3d);
  border: 2px solid #e4b849;
  box-shadow:
    0 0 0 5px #e5bb4a15,
    0 15px 45px #00000065,
    inset 0 0 30px #ffffff08;
}

.wheel-area {
  width: min(100%, 440px);
  margin: 10px auto 25px;
  position: relative;
  aspect-ratio: 1;
}

.wheel-frame {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 10px;
  background: linear-gradient(135deg, #fff2a9, #c78b20, #fff0a5, #a66c10);
  box-shadow:
    0 0 0 4px #5b3185,
    0 0 30px #ffce5555,
    0 12px 25px #0008;
}

#wheel {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transform: rotate(0deg);
  transition: transform 6s cubic-bezier(.12,.72,.08,1);
  filter: drop-shadow(0 3px 5px #0005);
}

.pointer {
  position: absolute;
  z-index: 5;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 19px solid transparent;
  border-right: 19px solid transparent;
  border-top: 38px solid #fff1a2;
  filter: drop-shadow(0 4px 3px #0008);
}

.pointer::after {
  content: "";
  position: absolute;
  top: -39px;
  left: -10px;
  width: 20px;
  height: 20px;
  background: linear-gradient(135deg, #fffbd3, #d59a28);
  border-radius: 50%;
  border: 2px solid #8b5a0c;
}

.center-decoration {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 85px;
  height: 85px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: linear-gradient(145deg, #fff3b4, #e1a832, #a56b0c);
  border: 5px solid #fff0a1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  box-shadow: 0 4px 15px #0008, 0 0 25px #ffd65a66;
  z-index: 3;
  pointer-events: none;
}

.form-area {
  text-align: center;
}

.label {
  color: #ffe8a0;
  font-weight: bold;
  margin-bottom: 10px;
  font-size: 14px;
}

input {
  width: 100%;
  max-width: 420px;
  display: block;
  margin: auto;
  padding: 16px;
  border-radius: 14px;
  border: 2px solid #d9aa42;
  background: #18082b;
  color: white;
  outline: none;
  font-size: 16px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}

input:focus {
  border-color: #fff0a2;
  box-shadow: 0 0 15px #ffd75a33;
}

input::placeholder {
  color: #b8a0d1;
}

#spinButton {
  width: 100%;
  max-width: 420px;
  display: block;
  margin: 18px auto 0;
  padding: 17px;
  border: none;
  border-radius: 15px;
  background: linear-gradient(135deg, #ffe88b, #e9b43b, #ffdf6b);
  color: #3b1855;
  font-size: 18px;
  font-weight: 1000;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 6px 0 #976719, 0 10px 25px #0005;
  transition: transform .15s, filter .2s;
}

#spinButton:hover {
  filter: brightness(1.08);
  transform: translateY(-2px);
}

#spinButton:active {
  transform: translateY(3px);
  box-shadow: 0 3px 0 #976719;
}

#spinButton:disabled {
  cursor: not-allowed;
  opacity: .65;
  transform: none;
}

#result {
  margin-top: 20px;
  text-align: center;
  padding: 20px;
  border-radius: 18px;
  display: none;
  background: linear-gradient(145deg, #fff0a8, #e6b544);
  color: #35164e;
  font-weight: 900;
  box-shadow: 0 0 25px #ffdb6a44;
  animation: aparecer .5s ease;
}

#result .result-title {
  font-size: 16px;
  margin-bottom: 8px;
}

#result .result-prize {
  font-size: clamp(22px, 5vw, 30px);
}

#result .result-message {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
}

#message {
  min-height: 22px;
  margin-top: 14px;
  text-align: center;
  color: #ffe9a0;
  font-size: 13px;
}

.footer {
  text-align: center;
  padding: 22px 10px;
  font-size: 12px;
  color: #cbb5e7;
}

@keyframes aparecer {
  from { opacity: 0; transform: scale(.85); }
  to { opacity: 1; transform: scale(1); }
}

@media (max-width: 480px) {
  header {
    padding-top: 20px;
  }

  .card {
    padding: 20px 12px;
    border-radius: 22px;
  }

  .wheel-area {
    width: 100%;
  }

  .wheel-frame {
    padding: 7px;
  }

  .center-decoration {
    width: 68px;
    height: 68px;
    font-size: 29px;
  }

  #spinButton {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🍇 Açaí da Família Castro</div>
  <div class="slogan">SEMPRE MAIS PERTO DE VOCÊ! 💛</div>
</header>

<main>

  <div class="title">
    <h1>ROLETA PREMIADA</h1>
    <p>Digite seu código e descubra seu prêmio!</p>
  </div>

  <div class="card">

    <div class="wheel-area">

      <div class="pointer"></div>

      <div class="wheel-frame">
        <canvas id="wheel" width="800" height="800"></canvas>
      </div>

      <div class="center-decoration">🍧</div>

    </div>

    <div class="form-area">

      <div class="label">🎁 DIGITE SEU CÓDIGO DA SORTE</div>

      <input
        id="codigo"
        type="text"
        placeholder="EX.: ACAI-A82K91"
        maxlength="20"
        autocomplete="off"
      >

      <button id="spinButton" onclick="girar()">
        🎰 GIRAR A ROLETA!
      </button>

      <div id="message"></div>

      <div id="result">
        <div class="result-title">✨ SEU PRÊMIO É ✨</div>
        <div class="result-prize" id="prizeText"></div>
        <div class="result-message">
          💜 Obrigado por comprar no Açaí da Família Castro!
        </div>
      </div>

    </div>

  </div>

</main>

<div class="footer">
  🍇 Açaí da Família Castro • Boa sorte! 💜
</div>

<script>
const premios = [
  { nome: "10% de desconto", texto: "10% OFF", emoji: "🏷️", cor: "#7b36bb" },
  { nome: "Açaí pequeno grátis", texto: "AÇAÍ 300 ML GRÁTIS", emoji: "🍧", cor: "#b52b87" },
  { nome: "Adicional grátis", texto: "ADICIONAL GRÁTIS", emoji: "🥜", cor: "#7134bd" },
  { nome: "R$ 5 de desconto", texto: "R$ 5 OFF", emoji: "💰", cor: "#cb3180" },
  { nome: "Fruta grátis", texto: "FRUTA GRÁTIS", emoji: "🍓", cor: "#8632bd" },
  { nome: "Entrega grátis", texto: "ENTREGA GRÁTIS", emoji: "🛵", cor: "#a82a8d" },
  { nome: "R$ 5 de desconto", texto: "R$ 5 OFF", emoji: "💵", cor: "#7336ba" },
  { nome: "R$ 10 de desconto", texto: "R$ 10 OFF", emoji: "💸", cor: "#c22d82" },
  { nome: "Entrega grátis", texto: "ENTREGA GRÁTIS", emoji: "🛵", cor: "#8831b8" },
  { nome: "Tente novamente", texto: "TENTE DE NOVO", emoji: "🔄", cor: "#5d2999" }
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const total = premios.length;
const fatia = (Math.PI * 2) / total;
const centro = canvas.width / 2;
const raio = centro - 8;

function desenharRoleta() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  premios.forEach((premio, i) => {
    const inicio = -Math.PI / 2 + i * fatia;
    const fim = inicio + fatia;

    ctx.beginPath();
    ctx.moveTo(centro, centro);
    ctx.arc(centro, centro, raio, inicio, fim);
    ctx.closePath();

    const gradiente = ctx.createRadialGradient(
      centro, centro, 80,
      centro, centro, raio
    );

    gradiente.addColorStop(0, premio.cor);
    gradiente.addColorStop(1, "#26083f");

    ctx.fillStyle = gradiente;
    ctx.fill();

    ctx.strokeStyle = "#f8d775";
    ctx.lineWidth = 5;
    ctx.stroke();

    const angulo = inicio + fatia / 2;

    ctx.save();
    ctx.translate(centro, centro);
    ctx.rotate(angulo);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#fff2bd";
    ctx.font = "bold 36px Arial";
    ctx.fillText(premio.emoji, raio * 0.68, 0);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px Arial";

    const texto = premio.texto;
    const maxWidth = 190;

    const palavras = texto.split(" ");
    let linhas = [];
    let linha = "";

    palavras.forEach(palavra => {
      const teste = linha ? linha + " " + palavra : palavra;

      if (ctx.measureText(teste).width > maxWidth && linha) {
        linhas.push(linha);
        linha = palavra;
      } else {
        linha = teste;
      }
    });

    if (linha) linhas.push(linha);

    const posTexto = raio * 0.43;
    const alturaLinha = 26;
    const inicioTexto = -((linhas.length - 1) * alturaLinha) / 2;

    linhas.forEach((l, index) => {
      ctx.fillText(l, posTexto, inicioTexto + index * alturaLinha);
    });

    ctx.restore();
  });

  // Borda externa
  ctx.beginPath();
  ctx.arc(centro, centro, raio, 0, Math.PI * 2);
  ctx.strokeStyle = "#ffe99a";
  ctx.lineWidth = 10;
  ctx.stroke();

  // Pontos dourados decorativos
  for (let i = 0; i < 40; i++) {
    const angulo = (Math.PI * 2 / 40) * i;
    const x = centro + Math.cos(angulo) * (raio - 4);
    const y = centro + Math.sin(angulo) * (raio - 4);

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff2b0";
    ctx.fill();
  }
}

desenharRoleta();

let girando = false;
let rotacaoAtual = 0;

function mostrarMensagem(texto) {
  document.getElementById("message").textContent = texto;
}

function encontrarIndices(nomePremio) {
  return premios
    .map((premio, index) => premio.nome === nomePremio ? index : -1)
    .filter(index => index !== -1);
}

async function girar() {
  if (girando) return;

  const campo = document.getElementById("codigo");
  const codigo = campo.value.trim().toUpperCase();
  const botao = document.getElementById("spinButton");
  const resultado = document.getElementById("result");

  resultado.style.display = "none";
  mostrarMensagem("");

  if (!codigo) {
    mostrarMensagem("⚠️ Digite seu código para girar!");
    campo.focus();
    return;
  }

  girando = true;
  botao.disabled = true;
  botao.textContent = "✨ SUA ROLETA ESTÁ GIRANDO...";

  try {
    const resposta = await fetch("/api/roleta/girar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ codigo })
    });

    const dados = await resposta.json();

    if (!resposta.ok || !dados.sucesso) {
      mostrarMensagem("❌ " + (dados.erro || "Código inválido."));
      girando = false;
      botao.disabled = false;
      botao.textContent = "🎰 GIRAR A ROLETA!";
      return;
    }

    const indices = encontrarIndices(dados.premio);

    if (!indices.length) {
      mostrarMensagem("⚠️ Prêmio recebido, mas não encontrado na roleta. Avise o atendimento.");
      girando = false;
      botao.disabled = false;
      botao.textContent = "🎰 GIRAR A ROLETA!";
      return;
    }

    // Se o prêmio aparece mais de uma vez, escolhe uma das casas.
    const indicePremio = indices[Math.floor(Math.random() * indices.length)];

    // O centro da casa escolhida ficará alinhado com o ponteiro.
    const anguloCentro = -90 + (indicePremio * 36) + 18;
    const destino = -90 - anguloCentro;

    // Acrescenta várias voltas completas para a animação.
    const voltas = 360 * 6;
    rotacaoAtual = rotacaoAtual + voltas + destino;

    canvas.style.transform = "rotate(" + rotacaoAtual + "deg)";

    setTimeout(() => {
      const premio = premios[indicePremio];

      document.getElementById("prizeText").textContent =
        premio.emoji + " " + premio.texto;

      resultado.style.display = "block";
      mostrarMensagem("💜 Parabéns! Seu código foi utilizado.");

      botao.disabled = false;
      botao.textContent = "🎰 GIRAR A ROLETA!";
      girando = false;

      // Limpa o código para evitar novo envio acidental.
      campo.value = "";
    }, 6200);

  } catch (erro) {
    mostrarMensagem("❌ Erro de conexão. Tente novamente.");
    girando = false;
    botao.disabled = false;
    botao.textContent = "🎰 GIRAR A ROLETA!";
  }
}

document.getElementById("codigo").addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !girando) {
    girar();
  }
});
</script>

</body>
</html>
