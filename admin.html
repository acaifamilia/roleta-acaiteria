
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo - Açaiteria</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#26083e,#63258b,#35104f);
  color:white;min-height:100vh
}
main{max-width:650px;margin:30px auto}
section{
  background:white;color:#35104f;padding:22px;
  border-radius:16px;margin-bottom:18px
}
h1{text-align:center}
h2{margin-top:0}
input,button{
  width:100%;padding:13px;margin:7px 0;
  border-radius:9px;font-size:16px
}
input{border:1px solid #ccc}
button{
  border:0;background:#63258b;color:white;
  font-weight:bold;cursor:pointer
}
button:hover{background:#45145f}
#mensagem{font-weight:bold;white-space:pre-wrap}
.item{
  border-bottom:1px solid #ddd;padding:12px 0;
  overflow-wrap:anywhere
}
small{color:#555}
.escondido{display:none}
</style>
</head>
<body>
<main>
<h1>🍧 Painel da Açaiteria</h1>

<section id="login">
<h2>Entrar no painel</h2>
<input id="senha" type="password" placeholder="Senha administrativa">
<button onclick="entrar()">ENTRAR</button>
<p id="erroLogin"></p>
</section>

<div id="painel" class="escondido">
<section>
<h2>➕ Cadastrar cliente</h2>
<input id="nome" placeholder="Nome do cliente">
<input id="telefone" placeholder="Telefone do cliente">
<button onclick="cadastrar()">GERAR CÓDIGO</button>
<p id="mensagem"></p>
</section>

<section>
<h2>📋 Clientes cadastrados</h2>
<button onclick="carregar()">ATUALIZAR LISTA</button>
<div id="lista"></div>
</section>
</div>
</main>

<script>
let token = "";

async function requisicao(url, opcoes = {}) {
  opcoes.headers = {
    "Content-Type":"application/json",
    ...(opcoes.headers || {})
  };
  if(token) opcoes.headers.Authorization = "Bearer " + token;

  const resposta = await fetch(url, opcoes);
  const dados = await resposta.json();

  if(!resposta.ok) throw new Error(dados.erro || "Ocorreu um erro");
  return dados;
}

async function entrar() {
  const erro = document.getElementById("erroLogin");
  erro.textContent = "Verificando...";
  try {
    const dados = await requisicao("/api/admin/login", {
      method:"POST",
      body:JSON.stringify({
        senha:document.getElementById("senha").value
      })
    });
    token = dados.token;
    document.getElementById("login").classList.add("escondido");
    document.getElementById("painel").classList.remove("escondido");
    carregar();
  } catch(e) {
    erro.textContent = e.message;
  }
}

async function cadastrar() {
  const mensagem = document.getElementById("mensagem");
  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();

  if(!nome || !telefone) {
    mensagem.textContent = "Preencha nome e telefone.";
    return;
  }

  mensagem.textContent = "Gerando código...";
  try {
    const dados = await requisicao("/api/admin/clientes", {
      method:"POST",
      body:JSON.stringify({nome, telefone})
    });

    mensagem.textContent = "✅ Cliente cadastrado!\nCódigo: " + dados.codigo;
    document.getElementById("nome").value = "";
    document.getElementById("telefone").value = "";
    carregar();
  } catch(e) {
    mensagem.textContent = "Erro: " + e.message;
  }
}

async function carregar() {
  const lista = document.getElementById("lista");
  lista.textContent = "Carregando...";
  try {
    const clientes = await requisicao("/api/admin/clientes");
    lista.innerHTML = "";

    if(!clientes.length) {
      lista.textContent = "Nenhum cliente cadastrado.";
      return;
    }

    clientes.forEach(cliente => {
      const item = document.createElement("div");
      item.className = "item";

      const nome = document.createElement("strong");
      nome.textContent = cliente.nome;

      const info = document.createElement("div");
      info.textContent = "Telefone: " + cliente.telefone;

      const codigo = document.createElement("div");
      codigo.textContent = "Código: " + (cliente.codigo || "Sem código");

      const status = document.createElement("small");
      status.textContent = cliente.usado ? " • Já utilizado" : " • Disponível";

      item.append(nome, info, codigo, status);
      lista.appendChild(item);
    });
  } catch(e) {
    lista.textContent = "Erro ao carregar: " + e.message;
  }
}
</script>
</body>
</html>
